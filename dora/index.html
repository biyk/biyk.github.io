<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта квартиры — организация вещей</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2026090101">
  <link rel="stylesheet" href="style.css?v=2026090101">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <h1>🗺️ Карта квартиры</h1>

      <div class="toolbar-group">
        <button data-action="add-room">➕ Комната</button>
        <button data-action="add-object">📦 Объект</button>
      </div>

      <div class="toolbar-group sep">
        <select id="planSelect" title="Текущая квартира" style="max-width:140px;"></select>
        <button data-action="add-plan" title="Добавить квартиру">➕ Квартира</button>
        <button data-action="manage-plans" title="Управление квартирами">⚙</button>
      </div>

      <div class="toolbar-group sep">
        <button data-action="guide-h" title="Добавить горизонтальную направляющую">─ Напр.</button>
        <button data-action="guide-v" title="Добавить вертикальную направляющую">│ Напр.</button>
        <button data-action="guide-clear" title="Очистить все направляющие">✕ Напр.</button>
      </div>

      <div class="toolbar-group sep">
        <input type="text" id="searchInput" placeholder="🔍 Поиск вещей...">
        <button data-action="search-clear">✕</button>
      </div>

      <div class="toolbar-group sep">
        <button data-action="zoom-out" title="Уменьшить">🔍−</button>
        <span id="zoom-level" style="font-size:12px;min-width:38px;text-align:center">100%</span>
        <button data-action="zoom-in" title="Увеличить">🔍+</button>
      </div>

      <div class="toolbar-group sep">
        <button data-action="export">⬇ Экспорт</button>
        <button data-action="import">⬆ Импорт</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
      </div>

      <div class="toolbar-group sep">
        <button data-action="gdrive-auth" id="gdrive-auth-btn" title="Авторизация Google">☁ Войти</button>
        <button data-action="retry-sync" id="sync-error-btn" title="Не удалось сохранить изменения в Google Sheets — нажмите, чтобы повторить" style="display:none;">⚠️</button>
      </div>
    </header>

    <div id="main">
      <div id="plan-container">
        <svg id="plan" viewBox="0 0 5000 3500" preserveAspectRatio="xMinYMin meet"></svg>
      </div>
      <aside id="info-panel">
        <div id="panel-default">
          <h3>🎯 Выберите объект или комнату</h3>
          <p>Кликните на элемент на плане, чтобы увидеть содержимое.</p>
          <p style="margin-top:12px;font-size:12px;color:#666;">
            🖱 Перетаскивайте объекты и комнаты<br>
            📏 Линейка слева и сверху — метры<br>
            ─ │ Направляющие для выравнивания
          </p>
        </div>
        <div id="panel-content" style="display:none;"></div>
      </aside>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="js/core/EventBus.js?v=2026090101"></script>
  <script src="js/core/utils.js?v=2026090101"></script>
  <script src="js/core/DataStore.js?v=2026090101"></script>
  <script src="js/ui/Ruler.js?v=2026090101"></script>
  <script src="js/ui/GuideManager.js?v=2026090101"></script>
  <script src="js/interaction/SearchManager.js?v=2026090101"></script>
  <script src="js/interaction/DragManager.js?v=2026090101"></script>
  <script src="js/io/ExportImport.js?v=2026090101"></script>
  <script src="js/ui/ModalManager.js?v=2026090101"></script>
  <script src="js/ui/PanelManager.js?v=2026090101"></script>
  <script src="js/ui/Renderer.js?v=2026090101"></script>
  <script src="js/app.js?v=2026090101"></script>
  <button id="authorize_button" style="display:none;"></button>
  <button id="signout_button" style="display:none;"></button>
</body>
</html>
